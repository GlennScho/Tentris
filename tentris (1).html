<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tentris</title>
<style>
  :root{
    --ink:#0c0911;
    --cream:#fff4cf;
    --yellow:#ffd338;
    --orange:#ff8b25;
    --red:#ef4450;
    --cyan:#34c5f4;
    --blue:#246cde;
    --green:#4fc05b;
    --purple:#a858dc;
    --panel:#191226;
    --panel2:#251a35;
    --muted:#d9cfe1;
  }
  *{box-sizing:border-box}
  html{background:#100b18}
  body{
    margin:0;
    min-height:100vh;
    padding:22px 16px 34px;
    font-family:"Courier New",Courier,monospace;
    color:var(--cream);
    background-color:#100b18;
    background-image:
      linear-gradient(45deg,rgba(255,255,255,.026) 25%,transparent 25%),
      linear-gradient(-45deg,rgba(255,255,255,.026) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,rgba(255,255,255,.026) 75%),
      linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.026) 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  .arcade{width:min(1040px,100%);margin:0 auto}
  .logo{display:flex;justify-content:center;align-items:center;margin:0 0 4px;}
  .logo img{display:block;width:min(100%,860px);height:auto;image-rendering:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.55));}
  .strap{
    margin:8px 0 20px;
    text-align:center;
    color:#ffe56c;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    text-transform:uppercase;
    text-shadow:2px 2px 0 #000;
  }
  .wrap{
    display:grid;
    grid-template-columns:minmax(430px,560px) minmax(250px,300px);
    gap:18px;
    justify-content:center;
    align-items:start;
  }
  .panel{
    position:relative;
    background:var(--panel);
    border:4px solid #08050b;
    box-shadow:0 0 0 4px var(--yellow),8px 8px 0 #000;
  }
  .panel:before{
    content:"";
    position:absolute;
    inset:7px;
    pointer-events:none;
    border:2px dashed rgba(255,255,255,.07);
  }
  .boardPanel{padding:14px}
  .side{padding:14px;display:flex;flex-direction:column;gap:14px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:0}
  #game{background:#5a9b45;border:4px solid #08050b;box-shadow:0 0 0 3px #ffe45d}
  #next{background:#10151a;border:3px solid #07040b;box-shadow:0 0 0 2px var(--cyan)}
  .intro{
    position:relative;
    z-index:1;
    padding:2px 2px 4px;
    text-align:center;
    font-size:11px;
    line-height:1.55;
    font-weight:800;
    color:#eee4f2;
  }
  .intro strong{color:#ffe56c}
  .card{
    position:relative;
    z-index:1;
    background:var(--panel2);
    border:3px solid #09050d;
    padding:12px;
    box-shadow:0 0 0 2px #513a70;
  }
  .title{
    display:inline-block;
    margin:0 0 10px;
    padding:4px 7px;
    background:var(--yellow);
    color:#110d17;
    font-size:12px;
    line-height:1;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:3px 3px 0 #000;
  }
  .next-name{
    margin:9px 0 0;
    text-align:center;
    min-height:16px;
    font-size:11px;
    color:#fff0a8;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .stats .row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 4px;
    border-bottom:2px dotted #5c4772;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .stats .row:last-child{border-bottom:0}
  .big{font-size:17px;line-height:1;color:#fff16b;text-shadow:2px 2px 0 #000}
  .packing-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:10px;line-height:1.3;text-transform:uppercase}
  .packing-list span{display:flex;align-items:center;gap:5px;color:#bfb0cb}
  .packing-list span.done{color:#74e982}
  .packing-list span.current{color:#ffe56c}
  .pip{display:inline-block;width:7px;height:7px;background:#67567d;box-shadow:1px 1px 0 #000}
  .done .pip{background:#4fc05b}.current .pip{background:#ffd338}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button{
    min-height:44px;
    padding:9px 8px;
    border:3px solid #09050d;
    border-radius:0;
    background:#236cdf;
    color:white;
    font:900 14px/1 "Courier New",Courier,monospace;
    box-shadow:3px 3px 0 #000,inset 2px 2px 0 rgba(255,255,255,.18);
    cursor:pointer;
  }
  button:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
  button:active{transform:translate(3px,3px);box-shadow:none}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #rotate{background:var(--yellow);color:#151019}
  #drop{background:var(--red)}
  #pause{background:var(--purple)}
  #restart{background:var(--green);color:#08110b}
  .wide{grid-column:span 3}
  .secondary-actions{display:flex;gap:8px;margin-top:9px}.secondary-actions button{flex:1}
  .status{
    position:relative;
    z-index:1;
    min-height:34px;
    padding:10px 10px 8px;
    text-align:center;
    border:3px solid #09050d;
    background:#09050d;
    color:#73f083;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    text-shadow:2px 2px 0 #173c1d;
    box-shadow:0 0 0 2px #44305e;
  }
  .coin-line{
    margin-top:18px;
    text-align:center;
    color:#ffcf3e;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    animation:blink 1.2s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:.38}}
  @media (prefers-reduced-motion:reduce){.coin-line{animation:none}}
  @media(max-width:860px){
    .wrap{grid-template-columns:1fr;max-width:560px;margin:0 auto}
    .side{display:grid;grid-template-columns:1fr 1fr}
    .intro,.stats,.controls-card,.status,.list-card{grid-column:1/-1}
  }
  @media(max-width:560px){
    body{padding:14px 10px 26px}
    .wrap{display:block}
    .side{display:flex;margin-top:18px}
    .panel{box-shadow:0 0 0 3px var(--yellow),5px 5px 0 #000}
    .logo img{width:100%}
  }
</style>
</head>

  function cloneCells(cells){ return cells.map(([x,y]) => [x,y]); }
  function bounds(cells){
    const xs = cells.map(c => c[0]);
    const ys = cells.map(c => c[1]);
    return {minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys), w:Math.max(...xs)-Math.min(...xs)+1, h:Math.max(...ys)-Math.min(...ys)+1};
  }
  function normalize(cells){
    const b = bounds(cells);
    return cells.map(([x,y]) => [x-b.minX,y-b.minY]);
  }
  function rotateCells(cells){ return normalize(cells.map(([x,y]) => [-y,x])); }

  function newBoard(){ return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

  function makePiece(index){
    const item = ITEMS[index % ITEMS.length];
    const cells = cloneCells(item.cells);
    const b = bounds(cells);
    return {
      index,
      item,
      cells,
      x:Math.floor((COLS - b.w) / 2),
      y:-b.h
    };
  }

  function isBlocked(x,y){ return BLOCKED.has(`${x},${y}`); }

  function collide(piece, dx=0, dy=0, testCells=piece.cells){
    for(const [cx,cy] of testCells){
      const x = piece.x + cx + dx;
      const y = piece.y + cy + dy;
      if(x < 0 || x >= COLS || y >= ROWS) return true;
      if(y >= 0 && (isBlocked(x,y) || board[y][x])) return true;
    }
    return false;
  }


  function clearCompletedRows(){
    const rows = [];
    for(let y=0;y<ROWS;y++){
      let full = true;
      for(let x=0;x<COLS;x++){
        if(isBlocked(x,y) || !board[y][x]){ full = false; break; }
      }
      if(full) rows.push(y);
    }
    if(!rows.length) return 0;

    const rowSet = new Set(rows);
    settled = settled.map(piece => {
      const newCells = [];
      for(const [x,y] of piece.cells){
        if(rowSet.has(y)) continue;
        const shift = rows.filter(r => r > y).length;
        newCells.push([x, y + shift]);
      }
      return {...piece, cells:newCells};
    }).filter(piece => piece.cells.length);

    board = newBoard();
    for(const piece of settled){
      for(const [x,y] of piece.cells){
        if(y >= 0 && y < ROWS && x >= 0 && x < COLS) board[y][x] = piece.index + 1;
      }
    }
    return rows.length;
  }

  function spawnNext(){
    current = makePiece(itemIndex);
    if(collide(current)){
      current = null;
      gameOver = true;
      statusEl.textContent = `BOOT FULL — ${packedCount} ITEMS PACKED!`;
      syncUI();
    }
  }

  function lockCurrent(){
    if(!current) return;
    for(const [cx,cy] of current.cells){
      const x = current.x + cx;
      const y = current.y + cy;
      if(y < 0){
        gameOver = true;
        statusEl.textContent = 'NO ROOM LEFT — TRY AGAIN!';
        return;
      }
    }
    const abs = current.cells.map(([cx,cy]) => [current.x+cx,current.y+cy]);
    settled.push({item:current.item,index:current.index,cells:abs});
    for(const [x,y] of abs) board[y][x] = current.index + 1;
    const cleared = clearCompletedRows();
    packedCount++;
    score += 100 + cleared * 250;
    itemIndex++;
    statusEl.textContent = cleared
      ? `${current.item.name.toUpperCase()} PACKED — ${cleared === 1 ? 'LAYER' : cleared + ' LAYERS'} CLEARED!`
      : `${current.item.name.toUpperCase()} PACKED!`;
    spawnNext();
    syncUI();
  }

  function move(dx,dy){
    if(paused || gameOver || gameWon || !current) return false;
    if(!collide(current,dx,dy)){
      current.x += dx;
      current.y += dy;
      return true;
    }
    if(dy > 0) lockCurrent();
    return false;
  }

  function rotate(){
    if(paused || gameOver || gameWon || !current) return;
    const rotated = rotateCells(current.cells);
    for(const kick of [0,-1,1,-2,2]){
      if(!collide(current,kick,0,rotated)){
        current.cells = rotated;
        current.x += kick;
        return;
      }
    }
  }

  function hardDrop(){
    if(paused || gameOver || gameWon || !current) return;
    let distance = 0;
    while(!collide(current,0,1)){
      current.y++;
      distance++;
    }
    score += distance * 2;
    lockCurrent();
  }

  function ghostPiece(){
    if(!current) return null;
    const g = {...current, cells:cloneCells(current.cells)};
    while(!collide(g,0,1)) g.y++;
    return g;
  }

  function occupiedCells(){
    let total = 0;
    for(const row of board) for(const cell of row) if(cell) total++;
    return total;
  }

  function syncUI(){
    packedEl.textContent = `${packedCount}`;
    spaceEl.textContent = `${Math.round((occupiedCells()/FREE_CELLS)*100)}%`;
    scoreEl.textContent = score;
    const nextIndex = (itemIndex + 1) % ITEMS.length;
    nextNameEl.textContent = ITEMS[nextIndex].name;
    renderPackingList();
  }

  function renderPackingList(){
    packingListEl.innerHTML = '';
    const uniqueItems = [];
    const seen = new Set();
    for(const item of ITEMS){
      if(seen.has(item.kind)) continue;
      seen.add(item.kind);
      uniqueItems.push(item);
    }
    const currentKind = current ? current.item.kind : null;
    uniqueItems.forEach(item => {
      const span = document.createElement('span');
      if(item.kind === currentKind && !gameOver) span.className = 'current';
      span.innerHTML = `<i class="pip"></i>${item.name}`;
      packingListEl.appendChild(span);
    });
  }

  function roundRect(c,x,y,w,h,r){
    r = Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function drawGrass(c){
    const g = c.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,'#73ae55');
    g.addColorStop(1,'#4e8a3d');
    c.fillStyle = g;
    c.fillRect(0,0,canvas.width,canvas.height);
    c.fillStyle = 'rgba(34,87,32,.14)';
    for(let y=0;y<canvas.height;y+=16){
      for(let x=((y/16)%2)*8;x<canvas.width;x+=16){ c.fillRect(x,y,8,8); }
    }
  }

  function drawCarShell(c){
    // Use the supplied car artwork directly so the game view matches the reference as closely as possible.
    c.clearRect(0,0,canvas.width,canvas.height);
    if(carReference.complete && carReference.naturalWidth){
      c.drawImage(carReference, 6, 18, 508, 504);
    } else {
      const bg = c.createLinearGradient(0,0,0,canvas.height);
      bg.addColorStop(0,'#62c9c1'); bg.addColorStop(1,'#2f9f9b');
      c.fillStyle = bg; c.fillRect(0,0,canvas.width,canvas.height);
    }

    // Keep the artwork untouched above the boot. The gameplay starts above the car,
    // but the visible packing grid only appears once the items reach the boot opening.
    const trunkH = TRUNK_BOTTOM - TRUNK_TOP;
    c.save();
    c.beginPath();
    roundRect(c, BOOT_X-8, TRUNK_TOP-8, BOOT_W+16, trunkH+16, 18);
    c.clip();
    c.fillStyle='rgba(3,8,12,.10)';
    c.fillRect(BOOT_X-10,TRUNK_TOP-10,BOOT_W+20,trunkH+20);
    c.restore();

    // Very faint grid only inside the boot itself.
    c.strokeStyle='rgba(255,255,255,.08)'; c.lineWidth=1;
    for(let x=0;x<=COLS;x++){
      c.beginPath(); c.moveTo(BOOT_X+x*CELL,TRUNK_TOP); c.lineTo(BOOT_X+x*CELL,TRUNK_BOTTOM); c.stroke();
    }
    for(let y=TRUNK_TOP;y<=TRUNK_BOTTOM;y+=CELL){
      c.beginPath(); c.moveTo(BOOT_X,y); c.lineTo(BOOT_X+BOOT_W,y); c.stroke();
    }

    // Bottom stop line: pieces cannot enter the orange bumper area below this point.
    c.strokeStyle='rgba(255,255,255,.12)'; c.lineWidth=2;
    c.beginPath(); c.moveTo(BOOT_X,TRUNK_BOTTOM); c.lineTo(BOOT_X+BOOT_W,TRUNK_BOTTOM); c.stroke();
  }

      [0.30,0.70].forEach(t=>{ c.beginPath(); c.moveTo(bx+bw*t,by+bh*.18); c.lineTo(bx+bw*t,by+bh*.82); c.stroke(); });
      c.beginPath(); c.moveTo(bx+bw*.14,by+bh*.50); c.lineTo(bx+bw*.86,by+bh*.50); c.stroke();
      c.fillStyle='#eaf3ff'; c.font=`900 ${Math.max(8,cellSize*.16)}px Courier New`; c.textAlign='center'; c.fillText('TARP',bx+bw/2,by+bh*.56);
    }
    else if(kind==='blanket'){
      c.fillStyle='#d85058'; roundRect(c,bx+bw*.10,by+bh*.12,bw*.80,bh*.76,6); c.fill();
      c.strokeStyle='#f7d1a7'; c.lineWidth=Math.max(2,cellSize*.035);
      for(let i=1;i<4;i++){
        c.beginPath(); c.moveTo(bx+bw*(.10+i*.20),by+bh*.13); c.lineTo(bx+bw*(.10+i*.20),by+bh*.87); c.stroke();
        c.beginPath(); c.moveTo(bx+bw*.11,by+bh*(.12+i*.19)); c.lineTo(bx+bw*.89,by+bh*(.12+i*.19)); c.stroke();
      }
      c.fillStyle='#fff1d7'; c.font=`900 ${Math.max(8,cellSize*.16)}px Courier New`; c.textAlign='center'; c.fillText('BLANKET',bx+bw/2,by+bh*.55);
    }
    else if(kind==='pillows'){
      c.fillStyle='#f3ead6'; roundRect(c,bx+bw*.08,by+bh*.14,bw*.48,bh*.64,12);c.fill();roundRect(c,bx+bw*.44,by+bh*.22,bw*.48,bh*.64,12);c.fill();
      c.strokeStyle='#c9bfa9';c.lineWidth=2;roundRect(c,bx+bw*.12,by+bh*.18,bw*.40,bh*.56,9);c.stroke();roundRect(c,bx+bw*.48,by+bh*.26,bw*.40,bh*.56,9);c.stroke();
    }
    else if(kind==='kettle'){
      c.fillStyle='#d96632';c.beginPath();c.arc(bx+bw*.47,by+bh*.58,Math.min(bw,bh)*.28,0,Math.PI*2);c.fill();
      c.strokeStyle='#5d3826';c.lineWidth=Math.max(2,cellSize*.05);c.beginPath();c.arc(bx+bw*.47,by+bh*.44,Math.min(bw,bh)*.30,Math.PI,0);c.stroke();
      c.fillStyle='#d96632';c.beginPath();c.moveTo(bx+bw*.67,by+bh*.50);c.lineTo(bx+bw*.92,by+bh*.36);c.lineTo(bx+bw*.72,by+bh*.68);c.closePath();c.fill();
      c.fillStyle='#693c27';roundRect(c,bx+bw*.39,by+bh*.25,bw*.16,bh*.08,3);c.fill();
    }

    c.restore();
  }

  function renderNext(){
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    nctx.fillStyle='#10151a'; nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
    nctx.strokeStyle='rgba(255,255,255,.08)';
    for(let x=0;x<=5;x++){ nctx.beginPath(); nctx.moveTo(x*44,0); nctx.lineTo(x*44,nextCanvas.height); nctx.stroke(); }
    for(let y=0;y<=4;y++){ nctx.beginPath(); nctx.moveTo(0,y*36); nctx.lineTo(nextCanvas.width,y*36); nctx.stroke(); }

    const previewIndex = (itemIndex + 1) % ITEMS.length;
    const item = ITEMS[previewIndex];
    const cells = cloneCells(item.cells);
    const b = bounds(cells);
    const size = Math.min(34, 180/b.w, 105/b.h);
    const ox = (220-b.w*size)/2;
    const oy = (145-b.h*size)/2;
    drawPiece(nctx,{item,cells},1,ox,oy,size,true);
  }

  function drawOverlay(){
    if(paused || gameOver || gameWon){
      ctx.fillStyle='rgba(8,6,12,.66)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=gameWon?'#fff074':'#ffffff';
      ctx.font='900 34px Courier New';
      ctx.fillText(gameWon?'PACKED!':'PAUSED',canvas.width/2,310);
      if(gameOver){ ctx.fillText('NO ROOM!',canvas.width/2,310); }
      ctx.font='900 14px Courier New';
      ctx.fillStyle='#ffffff';
      if(gameWon) ctx.fillText('KEEP PACKING!',canvas.width/2,350);
      else if(gameOver) ctx.fillText(`YOU PACKED ${packedCount} ITEMS`,canvas.width/2,350);
      else ctx.fillText('PRESS P OR PAUSE TO CONTINUE',canvas.width/2,350);

    }
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawCarShell(ctx);
    for(const p of settled) drawPiece(ctx,p,1,BOOT_X,BOOT_Y,CELL,true);
    if(current && !gameOver && !gameWon){
      const ghost = ghostPiece();
      drawPiece(ctx,ghost,.20);
      drawPiece(ctx,current,1);
    }
    drawOverlay();
    renderNext();
  }

  function update(time=0){
    const delta = time-lastTime;
    lastTime = time;
    if(!paused && !gameOver && !gameWon && current){
      dropCounter += delta;
      if(dropCounter >= 1100){ dropCounter = 0; move(0,1); }
    }
    render();
    requestAnimationFrame(update);
  }

  function reset(){
    board = newBoard();
    settled = [];
    itemIndex = 0;
    packedCount = 0;
    score = 0;
    paused = false;
    gameOver = false;
    gameWon = false;
    dropCounter = 0;
    lastTime = 0;
    winTime = 0;
    current = makePiece(itemIndex);
    statusEl.textContent='READY TO PACK!';
    document.getElementById('pause').textContent='PAUSE';
    syncUI();
    canvas.focus({preventScroll:true});
  }

  document.getElementById('left').addEventListener('click',()=>move(-1,0));
  document.getElementById('right').addEventListener('click',()=>move(1,0));
  document.getElementById('down').addEventListener('click',()=>move(0,1));
  document.getElementById('rotate').addEventListener('click',rotate);
  document.getElementById('drop').addEventListener('click',hardDrop);
  document.getElementById('restart').addEventListener('click',reset);
  document.getElementById('pause').addEventListener('click',()=>{
    if(gameOver || gameWon) return;
    paused = !paused;
    document.getElementById('pause').textContent = paused ? 'RESUME' : 'PAUSE';
    statusEl.textContent = paused ? 'PAUSED' : 'KEEP PACKING!';
  });

  document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.key) || e.code==='Space') e.preventDefault();
    if(e.key==='ArrowLeft') move(-1,0);
    else if(e.key==='ArrowRight') move(1,0);
    else if(e.key==='ArrowDown') move(0,1);
    else if(e.key==='ArrowUp') rotate();
    else if(e.code==='Space') hardDrop();
    else if(e.key==='p' || e.key==='P'){
      if(!gameOver && !gameWon){ paused=!paused; document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'; statusEl.textContent=paused?'PAUSED':'KEEP PACKING!'; }
    }
  });

  reset();
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
