<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caravan Tetris</title>

<style>
  :root{
    --ink:#0d0912;
    --cream:#fff5cf;
    --yellow:#ffc928;
    --orange:#ff8a18;
    --red:#ef3944;
    --cyan:#22b9f5;
    --blue:#1668e8;
    --green:#34bf52;
    --purple:#a84ce8;
    --panel:#181126;
    --panel2:#221834;
    --muted:#d1c6df;
  }
  *{box-sizing:border-box}
  html{background:#100b18}
  body{
    margin:0;
    min-height:100vh;
    padding:22px 16px 34px;
    font-family:"Courier New",Courier,monospace;
    color:var(--cream);
    background-color:#100b18;
    background-image:
      linear-gradient(45deg,rgba(255,255,255,.028) 25%,transparent 25%),
      linear-gradient(-45deg,rgba(255,255,255,.028) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,rgba(255,255,255,.028) 75%),
      linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.028) 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  .arcade{
    width:min(980px,100%);
    margin:0 auto;
  }
  .logo-wrap{
    display:flex;
    justify-content:center;
    margin:0 auto 10px;
    padding:0 8px;
  }
  .game-logo{
    display:block;
    width:min(560px,88vw);
    height:auto;
    image-rendering:pixelated;
    filter:drop-shadow(6px 7px 0 #000);
  }
  .strap{
    text-align:center;
    margin:4px 0 18px;
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    color:#ffe46d;
    text-shadow:2px 2px 0 #000;
  }
  .wrap{
    display:grid;
    grid-template-columns:minmax(360px,500px) minmax(250px,300px);
    gap:18px;
    justify-content:center;
    align-items:start;
  }
  .panel{
    position:relative;
    background:var(--panel);
    border:4px solid #0c0710;
    border-radius:0;
    box-shadow:
      0 0 0 4px var(--yellow),
      8px 8px 0 #000;
  }
  .panel:before{
    content:"";
    position:absolute;
    inset:6px;
    pointer-events:none;
    border:2px dashed rgba(255,255,255,.08);
  }
  .boardPanel{padding:14px}
  .side{padding:14px;display:flex;flex-direction:column;gap:14px}
  canvas{
    display:block;
    width:100%;
    height:auto;
    image-rendering:pixelated;
    border-radius:0;
  }
  #game{
    border:4px solid #0b0710;
    box-shadow:0 0 0 3px #ffe45c;
    background:#5e9f4b;
  }
  #next{
    border:3px solid #07040b;
    box-shadow:0 0 0 2px #27baf3;
  }
  .intro{padding:4px 2px 2px}
  .hero{display:none}
  .small{
    margin:0;
    text-align:center;
    font-size:12px;
    line-height:1.6;
    font-weight:700;
    color:#e9def2;
  }
  .card{
    background:var(--panel2);
    border:3px solid #09050d;
    border-radius:0;
    padding:12px;
    box-shadow:0 0 0 2px #4c356d;
  }
  .title{
    display:inline-block;
    margin:0 0 10px;
    padding:4px 7px;
    color:#101019;
    background:var(--yellow);
    font-size:12px;
    line-height:1;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:3px 3px 0 #000;
  }
  .stats .row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 4px;
    border-bottom:2px dotted #59456f;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .stats .row:last-child{border-bottom:0}
  .big{
    font-size:19px;
    line-height:1;
    color:#fff36b;
    text-shadow:2px 2px 0 #000;
  }
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button{
    min-height:44px;
    border:3px solid #09050d;
    border-radius:0;
    padding:9px 8px;
    font:900 14px/1 "Courier New",Courier,monospace;
    color:#fff;
    background:#1668e8;
    box-shadow:3px 3px 0 #000,inset 2px 2px 0 rgba(255,255,255,.2);
    cursor:pointer;
  }
  button:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
  button:active{transform:translate(3px,3px);box-shadow:none}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #rotate{background:var(--yellow);color:#1a1020}
  #drop{background:var(--red)}
  #pause{background:var(--purple)}
  #restart{background:var(--green);color:#09110b}
  .wide{grid-column:span 3}
  .secondary-actions{display:flex;gap:8px;margin-top:9px}
  .secondary-actions button{flex:1}
  .status{
    min-height:32px;
    padding:9px 10px 7px;
    text-align:center;
    border:3px solid #09050d;
    background:#09050d;
    color:#6ff47e;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    text-shadow:2px 2px 0 #163b1d;
    box-shadow:0 0 0 2px #3f2b58;
  }
  .coin-line{
    margin-top:18px;
    text-align:center;
    color:#ffcf3e;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    animation:blink 1.2s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:.38}}
  @media (prefers-reduced-motion:reduce){.coin-line{animation:none}}
  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;max-width:500px;margin:0 auto}
    .side{display:grid;grid-template-columns:1fr 1fr}
    .intro,.stats,.controls-card,.status{grid-column:1/-1}
  }
  @media(max-width:520px){
    body{padding:14px 10px 26px}
    .side{display:flex}
    .panel{box-shadow:0 0 0 3px var(--yellow),5px 5px 0 #000}
    .strap{font-size:10px;letter-spacing:1px}
  }
</style>
</head>

<script>

(() => {
  const COLS = 10, ROWS = 18, SIZE = 40;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const statusEl = document.getElementById('status');

  const carPalettes = [
    {base:'#eb4335', dark:'#b72216', light:'#ff7e74'},
    {base:'#2b86ff', dark:'#1453b7', light:'#7eb8ff'},
    {base:'#35bf4c', dark:'#18812a', light:'#7cec8d'},
    {base:'#ffa21f', dark:'#c16a00', light:'#ffc66f'},
    {base:'#b050ff', dark:'#7420bf', light:'#d093ff'},
    {base:'#f2d01a', dark:'#ba9800', light:'#ffea7c'}
  ];

  // 2 car tiles + 2 caravan tiles.
  const SHAPES = [
    [[0,0,'car'],[1,0,'car'],[2,0,'van'],[3,0,'van']],
    [[0,0,'car'],[1,0,'car'],[1,1,'van'],[1,2,'van']],
    [[1,0,'car'],[0,0,'car'],[0,1,'van'],[0,2,'van']],
    [[0,1,'car'],[0,0,'car'],[1,0,'van'],[2,0,'van']],
    [[0,0,'car'],[0,1,'car'],[1,1,'van'],[2,1,'van']],
    [[0,0,'car'],[0,1,'car'],[0,2,'van'],[1,2,'van']],
    [[1,0,'car'],[1,1,'car'],[1,2,'van'],[0,2,'van']]
  ];

  let board, settledPieces, current, next, score, lines, level, paused, gameOver, dropCounter, lastTime, uid;

  function createBoard(){ return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }
  function cloneCells(cells){ return cells.map(c => [...c]); }
  function bounds(cells){
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    return {
      minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys),
      w: Math.max(...xs) - Math.min(...xs) + 1,
      h: Math.max(...ys) - Math.min(...ys) + 1
    };
  }
  function normalize(cells){
    const b = bounds(cells);
    return cells.map(([x,y,t]) => [x - b.minX, y - b.minY, t]);
  }
  function rotateCells(cells){ return normalize(cells.map(([x,y,t]) => [-y, x, t])); }
  function makePiece(){
    return {
      id: ++uid,
      x: 3,
      y: -1,
      cells: cloneCells(SHAPES[(Math.random() * SHAPES.length) | 0]),
      palette: carPalettes[(Math.random() * carPalettes.length) | 0]
    };
  }

  function collide(piece, dx=0, dy=0, testCells=piece.cells){
    for(const [cx, cy] of testCells){
      const x = piece.x + cx + dx;
      const y = piece.y + cy + dy;
      if(x < 0 || x >= COLS || y >= ROWS) return true;
      if(y >= 0 && board[y][x]) return true;
    }
    return false;
  }

  function stampPiece(piece){
    for(const [cx, cy] of piece.cells){
      const x = piece.x + cx, y = piece.y + cy;
      if(y < 0) return false;
      board[y][x] = {pieceId: piece.id};
    }
    const absCells = piece.cells.map(([cx, cy, t]) => [piece.x + cx, piece.y + cy, t]);
    settledPieces.push({id: piece.id, cells: absCells, palette: piece.palette});
    return true;
  }

  function clearLines(){
    const fullRows = [];
    for(let y = 0; y < ROWS; y++) if(board[y].every(Boolean)) fullRows.push(y);
    if(!fullRows.length) return;

    for(const row of [...fullRows].reverse()){
      board.splice(row, 1);
      board.unshift(Array(COLS).fill(null));
    }

    const rowSet = new Set(fullRows);
    settledPieces = settledPieces.map(piece => {
      const newCells = piece.cells
        .filter(([x,y]) => !rowSet.has(y))
        .map(([x,y,t]) => {
          let shift = 0;
          for(const row of fullRows) if(row > y) shift++;
          return [x, y + shift, t];
        });
      return {...piece, cells: newCells};
    }).filter(piece => piece.cells.length);

    board = createBoard();
    for(const piece of settledPieces){
      for(const [x,y] of piece.cells){
        if(y >= 0 && y < ROWS && x >= 0 && x < COLS) board[y][x] = {pieceId: piece.id};
      }
    }

    lines += fullRows.length;
    score += [0,100,300,500,800][fullRows.length] * level;
    level = 1 + Math.floor(lines / 8);
    statusEl.textContent = fullRows.length === 1 ? 'Nice parking.' : `${fullRows.length} rows cleared.`;
  }

  function spawnNext(){
    current = next;
    current.x = 3;
    current.y = -1;
    next = makePiece();
    if(collide(current)){
      gameOver = true;
      statusEl.textContent = 'Car park full — game over.';
    }
  }

  function lockPiece(){
    if(!stampPiece(current)){
      gameOver = true;
      statusEl.textContent = 'Car park full — game over.';
      return;
    }
    clearLines();
    spawnNext();
    updateUI();
  }

  function move(dx, dy){
    if(paused || gameOver) return false;
    if(!collide(current, dx, dy)){
      current.x += dx;
      current.y += dy;
      return true;
    }
    if(dy > 0) lockPiece();
    return false;
  }

  function rotate(){
    if(paused || gameOver) return;
    const rotated = rotateCells(current.cells);
    for(const kick of [0,-1,1,-2,2]){
      if(!collide(current, kick, 0, rotated)){
        current.cells = rotated;
        current.x += kick;
        return;
      }
    }
  }

  function hardDrop(){
    if(paused || gameOver) return;
    let dist = 0;
    while(!collide(current, 0, 1)){
      current.y++;
      dist++;
    }
    score += dist * 2;
    lockPiece();
    updateUI();
  }

  function updateUI(){
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function roundedRect(c, x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function sortAlongOrientation(cells){
    const b = bounds(cells);
    if(b.w >= b.h) return [...cells].sort((a,b) => a[0] - b[0]);
    return [...cells].sort((a,b) => a[1] - b[1]);
  }

  function orientFromCells(cells){
    if(cells.length < 2){
      const b = bounds(cells);
      return b.w >= b.h ? 'right' : 'down';
    }
    const ordered = sortAlongOrientation(cells);
    const a = ordered[0], b = ordered[ordered.length - 1];
    if(Math.abs(b[0] - a[0]) >= Math.abs(b[1] - a[1])) return b[0] >= a[0] ? 'right' : 'left';
    return b[1] >= a[1] ? 'down' : 'up';
  }

  function nearestPair(cars, vans){
    let best, bestD = Infinity;
    for(const a of cars){
      for(const b of vans){
        const d = Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]);
        if(d < bestD){ bestD = d; best = [a,b]; }
      }
    }
    return best;
  }

  function centerOfCell(cell, scale=1, ox=0, oy=0){
    return [ox + (cell[0] + 0.5) * SIZE * scale, oy + (cell[1] + 0.5) * SIZE * scale];
  }

  function vehicleGroupRect(cells, scale=1, ox=0, oy=0){
    const b = bounds(cells);
    const horizontal = b.w >= b.h;
    const cell = SIZE * scale;
    const centerX = ox + ((b.minX + b.maxX + 1) / 2) * cell;
    const centerY = oy + ((b.minY + b.maxY + 1) / 2) * cell;
    const length = (horizontal ? b.w : b.h) * cell * 0.98;
    const width = cell * 0.80;
    const dir = orientFromCells(cells);
    return {horizontal, centerX, centerY, length, width, dir};
  }

  function applyDirectionRotation(c, dir){
    const rot = dir === 'right' ? 0 : dir === 'down' ? Math.PI/2 : dir === 'left' ? Math.PI : -Math.PI/2;
    c.rotate(rot);
  }

  function drawCarVehicle(c, cells, palette, scale=1, ox=0, oy=0, alpha=1){
    const vg = vehicleGroupRect(cells, scale, ox, oy);
    const L = vg.length * 0.94;
    const W = vg.width * 1.16;
    c.save();
    c.globalAlpha = alpha;
    c.translate(vg.centerX, vg.centerY);
    applyDirectionRotation(c, vg.dir);

    // Broad, simple top-down silhouette closely matching the reference.
    c.shadowColor = 'rgba(0,0,0,.18)';
    c.shadowBlur = 6 * scale;
    c.shadowOffsetY = 2 * scale;

    roundedRect(c, -L/2, -W/2, L, W, W * 0.34);
    c.fillStyle = palette.base;
    c.fill();
    c.shadowColor = 'transparent';
    c.lineWidth = Math.max(1, 1.0*scale);
    c.strokeStyle = 'rgba(0,0,0,.18)';
    c.stroke();

    // Very soft painted-body highlight, kept away from the windows.
    c.fillStyle = 'rgba(255,255,255,.08)';
    roundedRect(c, -L*0.42, -W*0.41, L*0.84, W*0.82, W*0.25);
    c.fill();

    // Front windscreen (+X): one clean, symmetrical trapezoid.
    c.fillStyle = '#34363a';
    c.strokeStyle = '#151515';
    c.lineWidth = Math.max(1.2, 1.5*scale);
    c.beginPath();
    c.moveTo(L*0.08, -W*0.34);
    c.lineTo(L*0.30, -W*0.29);
    c.quadraticCurveTo(L*0.34, 0, L*0.30, W*0.29);
    c.lineTo(L*0.08, W*0.34);
    c.quadraticCurveTo(L*0.02, 0, L*0.08, -W*0.34);
    c.closePath();
    c.fill();
    c.stroke();

    // Rear window (-X): smaller but perfectly mirrored and centred.
    c.beginPath();
    c.moveTo(-L*0.31, -W*0.28);
    c.lineTo(-L*0.12, -W*0.33);
    c.quadraticCurveTo(-L*0.08, 0, -L*0.12, W*0.33);
    c.lineTo(-L*0.31, W*0.28);
    c.quadraticCurveTo(-L*0.35, 0, -L*0.31, -W*0.28);
    c.closePath();
    c.fill();
    c.stroke();

    // Side glass strips, matching the reference without skewing the cabin.
    c.fillStyle = '#2a2b2e';
    roundedRect(c, -L*0.08, -W*0.43, L*0.24, W*0.10, W*0.035); c.fill();
    roundedRect(c, -L*0.08,  W*0.33, L*0.24, W*0.10, W*0.035); c.fill();

    // A narrow painted roof section between front and rear glass.
    c.fillStyle = palette.base;
    roundedRect(c, -L*0.095, -W*0.27, L*0.17, W*0.54, W*0.07); c.fill();

    // Mirrors: small body-coloured tabs on each side.
    c.fillStyle = palette.base;
    c.beginPath();
    c.moveTo(L*0.10, -W*0.48); c.lineTo(L*0.20, -W*0.58); c.lineTo(L*0.23, -W*0.47); c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(L*0.10,  W*0.48); c.lineTo(L*0.20,  W*0.58); c.lineTo(L*0.23,  W*0.47); c.closePath(); c.fill();

    // White headlights at the front corners.
    c.fillStyle = '#fffdf1';
    c.beginPath();
    c.ellipse(L*0.455, -W*0.28, L*0.025, W*0.12, 0.35, 0, Math.PI*2); c.fill();
    c.beginPath();
    c.ellipse(L*0.455,  W*0.28, L*0.025, W*0.12, -0.35, 0, Math.PI*2); c.fill();

    // Red tail lights at the rear corners.
    c.fillStyle = '#d92f32';
    c.beginPath();
    c.ellipse(-L*0.455, -W*0.30, L*0.025, W*0.105, -0.35, 0, Math.PI*2); c.fill();
    c.beginPath();
    c.ellipse(-L*0.455,  W*0.30, L*0.025, W*0.105, 0.35, 0, Math.PI*2); c.fill();

    c.restore();
  }

  function drawCaravanVehicle(c, cells, scale=1, ox=0, oy=0, alpha=1){
    const vg = vehicleGroupRect(cells, scale, ox, oy);
    const L = vg.length, W = vg.width;
    c.save();
    c.globalAlpha = alpha;
    c.translate(vg.centerX, vg.centerY);
    applyDirectionRotation(c, vg.dir);

    c.shadowColor = 'rgba(0,0,0,.18)';
    c.shadowBlur = 7 * scale;
    c.shadowOffsetY = 3 * scale;

    // Side-profile caravan body.
    c.beginPath();
    c.moveTo(-L*0.48, W*0.18);
    c.lineTo(-L*0.48, -W*0.12);
    c.quadraticCurveTo(-L*0.46, -W*0.40, -L*0.12, -W*0.42);
    c.lineTo(L*0.38, -W*0.42);
    c.quadraticCurveTo(L*0.48, -W*0.40, L*0.48, -W*0.28);
    c.lineTo(L*0.48, W*0.18);
    c.lineTo(-L*0.48, W*0.18);
    c.closePath();
    const grad = c.createLinearGradient(-L/2,0,L/2,0);
    grad.addColorStop(0,'#e8e2d7');
    grad.addColorStop(.5,'#f8f4ec');
    grad.addColorStop(1,'#ded6ca');
    c.fillStyle = grad;
    c.fill();
    c.shadowColor = 'transparent';
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(0,0,0,.12)';
    c.stroke();

    // Windows.
    c.fillStyle = '#6f8095';
    roundedRect(c, -L*0.15, -W*0.24, L*0.16, W*0.22, 3); c.fill();
    roundedRect(c, L*0.08, -W*0.24, L*0.16, W*0.22, 3); c.fill();

    // Door.
    c.strokeStyle = '#c6beb1';
    c.lineWidth = 1;
    roundedRect(c, -L*0.34, -W*0.24, L*0.12, W*0.44, 3); c.stroke();
    c.beginPath(); c.moveTo(-L*0.24, -W*0.02); c.lineTo(-L*0.22, -W*0.02); c.stroke();

    // Trim stripe.
    c.fillStyle = '#d68745';
    c.fillRect(-L*0.46, W*0.02, L*0.92, W*0.05);

    // Wheel.
    c.fillStyle = '#2a2528';
    c.beginPath(); c.arc(L*0.18, W*0.20, W*0.16, 0, Math.PI*2); c.fill();
    c.fillStyle = '#b9b9bf';
    c.beginPath(); c.arc(L*0.18, W*0.20, W*0.08, 0, Math.PI*2); c.fill();

    // Rear light.
    c.fillStyle = '#e4545a';
    roundedRect(c, L*0.44, -W*0.10, 4, 10, 2); c.fill();

    // Hitch nose at the front.
    c.strokeStyle = '#d6dde5';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(-L*0.48, -W*0.02); c.lineTo(-L*0.60, 0); c.stroke();

    c.restore();
  }

  function drawHitch(c, a, b, scale=1, ox=0, oy=0, alpha=1){
    const [ax, ay] = centerOfCell(a, scale, ox, oy);
    const [bx, by] = centerOfCell(b, scale, ox, oy);
    c.save();
    c.globalAlpha = alpha;
    c.strokeStyle = '#cbd3dd';
    c.lineWidth = Math.max(2, 2.7 * scale);
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    c.fillStyle = '#e8edf4';
    c.beginPath(); c.arc((ax+bx)/2, (ay+by)/2, Math.max(2, 2.8 * scale), 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function drawPiece(c, piece, scale=1, ox=0, oy=0, alpha=1, cellsAlreadyAbsolute=false){
    const absCells = cellsAlreadyAbsolute ? piece.cells : piece.cells.map(([x,y,t]) => [piece.x + x, piece.y + y, t]);
    const carCells = absCells.filter(v => v[2] === 'car');
    const vanCells = absCells.filter(v => v[2] === 'van');
    const pair = nearestPair(carCells, vanCells);
    if(pair) drawHitch(c, pair[0], pair[1], scale, ox, oy, alpha);
    if(carCells.length) drawCarVehicle(c, carCells, piece.palette, scale, ox, oy, alpha);
    if(vanCells.length) drawCaravanVehicle(c, vanCells, scale, ox, oy, alpha);
  }

  function ghostPiece(piece){
    const g = {...piece, cells: piece.cells.map(c => [...c]), x: piece.x, y: piece.y};
    while(!collide(g,0,1)) g.y++;
    return g;
  }

  function drawGrid(){
    ctx.fillStyle = '#65a94f';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Tiny deterministic grass pixels for a retro field texture.
    ctx.fillStyle = 'rgba(43,112,42,.20)';
    for(let y=8; y<canvas.height; y+=20){
      for(let x=8; x<canvas.width; x+=20){
        if(((x/20)+(y/20)) % 3 === 0) ctx.fillRect(x,y,3,3);
      }
    }
    ctx.fillStyle = 'rgba(183,221,104,.16)';
    for(let y=16; y<canvas.height; y+=28){
      for(let x=16; x<canvas.width; x+=28){
        if(((x/28)+(y/28)) % 2 === 0) ctx.fillRect(x,y,2,4);
      }
    }

    ctx.strokeStyle = 'rgba(35,82,34,.48)';
    ctx.lineWidth = 1;
    for(let x=0; x<=COLS; x++){
      ctx.beginPath(); ctx.moveTo(x*SIZE,0); ctx.lineTo(x*SIZE,ROWS*SIZE); ctx.stroke();
    }
    for(let y=0; y<=ROWS; y++){
      ctx.beginPath(); ctx.moveTo(0,y*SIZE); ctx.lineTo(COLS*SIZE,y*SIZE); ctx.stroke();
    }
  }

  function renderBoard(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    for(const piece of settledPieces) drawPiece(ctx, piece, 1, 0, 0, 1, true);
    if(current && !gameOver){
      drawPiece(ctx, ghostPiece(current), 1, 0, 0, .22, false);
      drawPiece(ctx, current, 1, 0, 0, 1, false);
    }
    if(paused || gameOver){
      ctx.fillStyle = 'rgba(3,8,15,.72)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Arial';
      ctx.fillText(gameOver ? 'GAME OVER' : 'PAUSED', canvas.width/2, canvas.height/2);
      ctx.font = '20px Arial';
      if(gameOver) ctx.fillText('Press Restart to go again', canvas.width/2, canvas.height/2 + 36);
    }
  }

  function renderNext(){
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    nctx.fillStyle = '#65a94f';
    nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
    nctx.strokeStyle = '#18304d';
    for(let x=0; x<=5; x++){
      nctx.beginPath(); nctx.moveTo(x*44,0); nctx.lineTo(x*44,150); nctx.stroke();
    }
    for(let y=0; y<=3; y++){
      nctx.beginPath(); nctx.moveTo(0,y*50); nctx.lineTo(220,y*50); nctx.stroke();
    }

    const cells = normalize(cloneCells(next.cells));
    const b = bounds(cells);
    const scale = Math.min(1, Math.min(4.2 / b.w, 2.8 / b.h));
    const ox = (220 - b.w * SIZE * scale) / 2;
    const oy = (150 - b.h * SIZE * scale) / 2;
    drawPiece(nctx, {cells, palette: next.palette}, scale, ox, oy, 1, true);
  }

  function render(){ renderBoard(); renderNext(); }

  function update(time=0){
    const delta = time - lastTime;
    lastTime = time;
    if(!paused && !gameOver){
      dropCounter += delta;
      const speed = Math.max(130, 700 - (level - 1) * 60);
      if(dropCounter >= speed){ dropCounter = 0; move(0,1); }
    }
    render();
    requestAnimationFrame(update);
  }

  function reset(){
    board = createBoard();
    settledPieces = [];
    score = 0; lines = 0; level = 1;
    paused = false; gameOver = false; dropCounter = 0; lastTime = 0; uid = 0;
    next = makePiece();
    spawnNext();
    updateUI();
    statusEl.textContent = 'READY!';
    canvas.focus();
  }

  document.getElementById('left').addEventListener('click', () => move(-1,0));
  document.getElementById('right').addEventListener('click', () => move(1,0));
  document.getElementById('down').addEventListener('click', () => move(0,1));
  document.getElementById('rotate').addEventListener('click', rotate);
  document.getElementById('drop').addEventListener('click', hardDrop);
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('pause').addEventListener('click', () => {
    if(gameOver) return;
    paused = !paused;
    statusEl.textContent = paused ? 'PAUSED' : 'READY!';
  });

  document.addEventListener('keydown', e => {
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Spacebar'].includes(e.key) || e.code === 'Space') e.preventDefault();
    if(e.key === 'ArrowLeft') move(-1,0);
    else if(e.key === 'ArrowRight') move(1,0);
    else if(e.key === 'ArrowDown') move(0,1);
    else if(e.key === 'ArrowUp') rotate();
    else if(e.key === ' ' || e.code === 'Space') hardDrop();
    else if(e.key === 'p' || e.key === 'P'){ if(!gameOver) paused = !paused; }
  });

  reset();
  requestAnimationFrame(update);
})();

</script>
</body>
</html>
